name: WH HQ Research Engine

on:
  pull_request:
    paths:
      - 'research/**'
      - 'data/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'

# PR runs are intentionally read-only. Scheduled/manual runs may save evidence.
permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate data
        run: python research/validate_data.py
      - name: Check approved sources
        run: python research/watch_sources.py
      - name: Check canonical datasets
        run: python research/check_changes.py
