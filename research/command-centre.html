<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WH HQ — Research Command Centre</title>
<style>
:root{--ink:#102a43;--blue:#1f78c8;--bg:#f4f8fb;--card:#fff;--muted:#627d98;--line:#d9e2ec;--good:#2f855a;--warn:#b7791f;--bad:#c53030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:32px 22px 60px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--blue)}h1{font-size:38px;line-height:1.05;margin:7px 0}.sub{color:var(--muted)}.badge{background:#e8f4ec;color:var(--good);padding:8px 12px;border-radius:999px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(16,42,67,.05)}.stat{padding:18px}.label{font-size:12px;color:var(--muted);font-weight:700}.num{font-size:30px;font-weight:800;margin-top:4px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{padding:20px}.panel h2{margin:0 0 14px;font-size:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);gap:12px}.row:first-of-type{border-top:0}.name{font-weight:700}.small{font-size:12px;color:var(--muted)}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;white-space:nowrap}.healthy{background:#e8f4ec;color:var(--good)}.change{background:#fff4db;color:var(--warn)}.attention{background:#fde8e8;color:var(--bad)}.not_checked{background:#edf2f7;color:var(--muted)}.review{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.review strong{display:block}.sev{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.critical{color:var(--bad)}.high{color:var(--warn)}.medium{color:var(--blue)}a{color:var(--blue)}.empty{color:var(--muted);padding:12px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="eyebrow">WH HQ · V6.9</div><h1>Research Command Centre.</h1><div class="sub">A read-only control room for source health, detected changes and human review.</div></div><div id="status" class="badge">Loading…</div></header>
<section class="grid" id="stats"></section>
<div class="layout"><section class="panel"><h2>Source health</h2><div id="sources"><div class="empty">Loading source status…</div></div></section><section class="panel"><h2>Research inbox</h2><div id="reviews"><div class="empty">Loading review queue…</div></div></section></div>
<p class="small" style="margin-top:18px">Last research run: <span id="lastRun">—</span><br>Safety: customer-facing canonical data is not changed by research runs.</p>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>s?new Date(s).toLocaleString():'—';
async function load(){
 const r=await fetch('reports/command-centre-latest.json?'+Date.now()); if(!r.ok) throw new Error('No Command Centre state yet'); const d=await r.json();
 const x=d.summary||{}; document.getElementById('status').textContent=x.attention?'Needs attention':x.changes?'Changes detected':'All systems healthy';
 document.getElementById('status').className='badge '+(x.attention?'attention':'');
 const stats=[['Sources',x.sources],['Healthy',x.healthy],['Changes',x.changes],['Needs attention',x.attention],['Pending review',x.pendingReviews]];
 document.getElementById('stats').innerHTML=stats.map(a=>`<div class="stat"><div class="label">${a[0]}</div><div class="num">${a[1]??0}</div></div>`).join('');
 document.getElementById('sources').innerHTML=(d.sources||[]).map(s=>`<div class="row"><div><div class="name">${esc(s.name)}</div><div class="small">${esc(s.use)} · ${esc(s.cadence)}</div></div><span class="pill ${esc(s.status)}">${esc(s.status.replace('_',' '))}</span></div>`).join('')||'<div class="empty">No sources registered.</div>';
 document.getElementById('reviews').innerHTML=(d.pendingReviews||[]).map(p=>`<div class="review"><div class="sev ${esc(p.severity)}">${esc(p.severity||'review')} · ${esc(p.topic||'general')}</div><strong>${esc(p.sourceName||p.source||'Research proposal')}</strong><div class="small">Affected: ${esc((p.affectedDatasets||[]).join(', ')||'Needs assessment')}</div><div class="small" style="margin-top:7px">${esc(p.recommendation||'Review evidence before changing canonical data.')}</div></div>`).join('')||'<div class="empty">No pending reviews. Nice and boring.</div>';
 document.getElementById('lastRun').textContent=fmt(d.lastRun);
}
load().catch(e=>{document.getElementById('status').textContent='State unavailable';document.getElementById('sources').innerHTML='<div class="empty">'+esc(e.message)+'</div>';document.getElementById('reviews').innerHTML='<div class="empty">Run the Research Engine to create the first state file.</div>';});
</script>
</body></html>
